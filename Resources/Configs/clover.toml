# Mu-Silicium device configuration for the Xiaomi Mi Pad 4 8" LTE (clover, SDM660).
#
# Derived from Resources/Configs/lavender.toml, the Redmi Note 7: the same SDM660 SoC, the
# same StarlordPkg silicon package, and a firmware volume that gta4l (SM6115, also eMMC)
# proves fits in 3 MiB with UniXNU and DarwinBoot embedded. The addresses are not borrowed
# from lavender though: they are the [MemoryMap] of this unit's own xbl partition, which
# Library/MemoryMapLib reproduces row for row (UniXNU-clover/facts/<serial>-<stamp>/).

#
# Boot Shim Configs
#
# true, as every upstream Mu device sets it.  BootShim.S emits an arm64 Linux image
# header when this is on: .quad FD_BASE at offset 8 (text_offset), .quad FD_SIZE at 16
# (image_size), "ARM\x64" at 56.  text_offset = 0x9fc00000 is not a legal value per the
# arm64 boot protocol, which wants a small page-aligned offset -- but round 6 measured
# what happens without the header and the answer was worse: the Mi logo flashed for a
# moment and the tablet went straight back to fastboot, where with the header the logo
# stayed.  Those two builds differ only in bytes 8..63 of the kernel blob, so this ABL
# does look at those bytes, and it is the loader that gets to decide what they mean.
# mkbootimg never writes this header (its own boot header is the image's first page,
# outside the kernel blob), so the flag is purely Mu's way of showing ABL the fields.
#
# Unresolved, and deliberately not smoothed over: the gzip builds (rounds 1 and 4) had
# no ARM\x64 magic either -- offset 56 held compressed bytes -- yet they froze on the
# logo like round 5 instead of bailing like round 6.  So "the magic is what makes ABL
# boot us" explains three of four observations, not four.  The way to stop reading a
# logo as a status light is the BootShim splash probe this overlay now carries; it
# paints ABL's live framebuffer before touching the firmware volume.
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
# The firmware volume occupies 0x9FC00000-0x9FF00000, the top of the low bank in the
# device's own map. Below it sits "ABOOT FV" at 0x9FA00000 and "FV Region" at
# 0x9F800000, and the splash window the stock xbl draws into is 0x9d400000 + 0x02400000,
# which ends exactly where FV Region starts. MemoryMapLib implements that arrangement;
# keep both files in step.
#
[uefi_fd]
base = 0x9FC00000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
# "none", deliberately, even though lavender says "gzip".  gzip here means the
# whole BootShim + FD is *replaced by a bare gzip stream*, so the first bytes the
# bootloader jumps to are 0x1f 0x8b -- that only works on an ABL that gunzips the
# boot image before entering it.  BootShim itself does no decompression (it copies
# FD_SIZE bytes to FD_BASE and branches), and this unit's own kernel sections are
# arm64 Image.gz-with-stub, which begin with executable code and decompress
# themselves -- so its 2018 header-v0 ABL has never needed gunzip support, and the
# two on-device attempts (frozen splash on a cold boot, straight back to fastboot
# from "fastboot boot") are what jumping into a gzip stream looks like.  The raw
# payload is 3 486 671 bytes against a 64 MiB partition and a 512 MiB
# download-buffer limit, so nothing here needs the compression.
#
[boot_image_kernel]
kernel_compression = "none"
append_dtb         = true

#
# Android Boot Image Configs
#
# Read off this unit, not inferred from lavender: facts/<serial>-<stamp>/img/
# unixnu-boot.img and unixnu-recovery.img are the device's own boot and recovery
# partitions, and both have 0 in the header_version slot -- version 0, the
# generation before the v1 header_size and dtb fields.  Their kernel sections are
# Image.gz with device trees appended straight after the gzip stream (111 in
# boot, 1 in recovery), which is exactly the append_dtb shape above, and neither
# image carries an AVB footer.  Lavender declares version 1 for the same SoC, but
# this ABL is holding these two v0 images and boots them.
#
# The load fields hold base-relative offsets (kernel 0x8000, ramdisk 0x1000000,
# tags 0x100) with the 0x80000000 left to the bootloader; board.toml's
# [bootimg.image] carries those numbers and the checker pins them here.
[boot_image]
header_version = 0
